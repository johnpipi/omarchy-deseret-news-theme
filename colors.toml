# Deseret News
#
# Palette taken from the official Deseret News Brand Guide (v.02-2, 8 Aug 2019):
#   Deseret Yellow  #ffd217   (Pantone 109U) - primary brand color
#   Gray 1          #f2f2f2
#   Gray 2          #424242
#   Off-Black       #1e1e1e
#   True Black      #000000
#
# The primary logo is black with a yellow period; this theme is that mark
# turned into a desktop - an off-black newsroom surface with Deseret Yellow
# carrying every accent. The syntax colors are derived to sit under the
# yellow without competing with it.

mode = "dark"

accent    = "#ffd217"   # Deseret Yellow
selection = "#4a3f14"   # Deseret Yellow, dropped into the background
muted     = "#424242"   # Gray 2

# Window/popup borders. Deseret Yellow at full strength is too loud for chrome
# that is on screen constantly, so borders use a muted brass while `accent`
# keeps the true brand yellow for highlights.
hyprland_active_border = "rgba(a98d19ee)"

background         = "#1e1e1e"   # Off-Black
dark_background    = "#141414"
darker_background  = "#000000"   # True Black
lighter_background = "#2b2b2b"

foreground        = "#d4d4d4"
dark_foreground   = "#7c7c7c"
light_foreground  = "#e6e6e6"
bright_foreground = "#f2f2f2"   # Gray 1

red     = "#e05a4f"
yellow  = "#ffd217"   # Deseret Yellow
orange  = "#f0932b"
green   = "#9bb43f"
cyan    = "#4bb3a6"
blue    = "#5b9bd5"
magenta = "#c78bb8"
brown   = "#8a6a3a"

bright_red     = "#ff7468"
bright_yellow  = "#ffe27a"
bright_green   = "#b8d15c"
bright_cyan    = "#6fd0c2"
bright_blue    = "#7fb8ea"
bright_magenta = "#e0a6d2"
